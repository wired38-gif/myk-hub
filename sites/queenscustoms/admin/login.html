<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queens Customs — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0C0A15',
              dark: '#04030A',
              accent: '#3B82F6',
              purple: '#6366F1',
              amber: '#F59E0B',
              teal: '#0D9488',
              surface: '#14122C',
              gold: '#D4AF37',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #04030A; }
    .glass { background: rgba(12,10,21,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(59,130,246,0.15); }
    .input-field { background: rgba(4,3,10,0.8); border: 1px solid rgba(59,130,246,0.2); transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .btn-primary { background: linear-gradient(135deg, #3B82F6, #6366F1); transition: all 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
    .btn-primary:active { transform: translateY(0); }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
    .glow { animation: glow 3s ease-in-out infinite; }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Ambient background glows -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl glow"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-purple-600/10 blur-3xl glow" style="animation-delay:1.5s"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-indigo-600/5 blur-2xl"></div>
  </div>

  <div class="w-full max-w-md px-4 relative z-10">

    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 shadow-2xl shadow-blue-900/50 mb-4 float">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Queens Customs</h1>
      <p class="text-sm text-slate-400 font-medium mt-1">Admin Portal Access</p>
    </div>

    <!-- Login Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-1">Welcome back</h2>
      <p class="text-slate-400 text-sm mb-6">Enter your admin credentials to continue</p>

      <div id="error-msg" class="hidden mb-4 p-3 rounded-xl bg-red-950/60 border border-red-800/50 text-red-300 text-sm font-medium flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="error-text"></span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="input-field w-full pl-10 pr-4 py-3 rounded-xl text-white text-sm font-medium placeholder-slate-600" placeholder="admin@queenscustoms.shop" autocomplete="email" required />
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="input-field w-full pl-10 pr-12 py-3 rounded-xl text-white text-sm font-medium placeholder-slate-600" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1" tabindex="-1">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary w-full py-3 rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2">
          <span id="btn-text">Sign In to Admin Portal</span>
          <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        </button>
      </form>

      <!-- Portal Selection -->
      <div id="portal-select" class="hidden mt-6">
        <p class="text-center text-xs text-slate-500 font-medium mb-3 uppercase tracking-wider">Select Portal</p>
        <div class="grid grid-cols-2 gap-3">
          <a href="/admin/operations" class="flex flex-col items-center p-4 rounded-xl border border-slate-800 hover:border-blue-600/50 hover:bg-blue-950/20 transition-all group cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-400 group-hover:text-blue-400 mb-2 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span class="text-xs font-semibold text-slate-300 group-hover:text-white transition-colors">Operations</span>
            <span class="text-[10px] text-slate-500 mt-0.5">Dashboard</span>
          </a>
          <a href="/admin/setup-wizard" class="flex flex-col items-center p-4 rounded-xl border border-slate-800 hover:border-purple-600/50 hover:bg-purple-950/20 transition-all group cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-400 group-hover:text-purple-400 mb-2 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            <span class="text-xs font-semibold text-slate-300 group-hover:text-white transition-colors">Setup</span>
            <span class="text-[10px] text-slate-500 mt-0.5">Integrations</span>
          </a>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">Queens Customs Shop &copy; 2024 — Secure Admin Access</p>
  </div>

  <script>
    const API_BASE = '';

    // Check if already logged in
    (function checkExistingSession() {
      const token = sessionStorage.getItem('admin_token') || localStorage.getItem('admin_token');
      if (!token) return;
      // Verify token is still valid
      fetch(`${API_BASE}/api/admin/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => {
        if (r.ok) showPortalSelect();
      }).catch(() => {});
    })();

    function showPortalSelect() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('portal-select').classList.remove('hidden');
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      document.getElementById('error-text').textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('login-form').classList.add('shake');
      setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 500);
    }

    function hideError() {
      document.getElementById('error-msg').classList.add('hidden');
    }

    function togglePassword() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Signing in…';

      try {
        const res = await fetch(`${API_BASE}/api/admin/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Login failed');
          return;
        }

        // Persist token
        sessionStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));

        btnText.textContent = '✓ Authenticated!';
        setTimeout(showPortalSelect, 500);

      } catch (err) {
        showError('Network error — please check server connection');
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
        if (btnText.textContent === 'Signing in…') btnText.textContent = 'Sign In to Admin Portal';
      }
    }
  </script>
</body>
</html>
